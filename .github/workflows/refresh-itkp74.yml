name: Update Data ITKP Kepka 74
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/update_itkp74_snapshot.py'
      - '.github/workflows/refresh-itkp74.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: itkp74-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ambil lima sheet publik dan buat snapshot
        run: python scripts/update_itkp74_snapshot.py
      - name: Publikasikan snapshot bila berubah
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/data/itkp74-boot.json
          if [ -d assets/data/itkp74-details ]; then
            git add -A assets/data/itkp74-details/
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh ITKP Kepka 74 snapshot [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
